<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta name="robots" content="noindex,nofollow">
<title>MM Academy | Área de Membros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070a; --bg2:#0d0d11; --card:#121216; --card2:#18181e;
  --line:rgba(255,255,255,.07); --gline:rgba(245,196,66,.28);
  --text:#f5f2ea; --muted:#9c978b; --dim:#6b675e;
  --g1:#fbe08a; --g2:#f2bd2c; --g3:#c28f0e; --g4:#7a5707;
  --gold:linear-gradient(135deg,#fbe08a 0%,#f2bd2c 45%,#c28f0e 100%);
  --ok:#3ddc97; --r:20px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
html{background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);background:
  radial-gradient(900px 500px at 50% -10%,rgba(242,189,44,.13),transparent 60%),
  radial-gradient(700px 400px at 100% 100%,rgba(242,189,44,.06),transparent 60%),var(--bg);
  min-height:100dvh;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,.disp{font-family:'Barlow Condensed',Inter,sans-serif;font-style:italic;font-weight:800;letter-spacing:.2px;text-transform:uppercase}
.gold{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent 240px)}
@media(min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 120px rgba(242,189,44,.07)}}

/* wordmark fallback */
.wm{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;line-height:.9;display:inline-block;text-align:center}
.wm b{display:block;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}

/* LOGIN */
.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(32px + var(--safe-b));position:relative;overflow:hidden}
.login::before{content:"";position:absolute;width:520px;height:520px;left:50%;top:-180px;transform:translateX(-50%);background:radial-gradient(circle,rgba(242,189,44,.22),transparent 65%);pointer-events:none}
.login .logo{width:176px;height:176px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 70px rgba(242,189,44,.25)}
.login .logo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.login .logo .wm{font-size:34px}
.lcard{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--gline);border-radius:26px;padding:26px 22px;backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lcard h1{font-size:30px;text-align:center;line-height:1}
.lcard p.sub{color:var(--muted);text-align:center;font-size:14px;margin:10px 0 22px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.inp{width:100%;background:#0a0a0d;border:1.5px solid var(--line);border-radius:14px;padding:16px;font-size:16px;outline:none;transition:.2s}
.inp:focus{border-color:var(--g2);box-shadow:0 0 0 4px rgba(242,189,44,.14)}
.err{color:#ff7a7a;font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:17px;border-radius:14px;background:var(--gold);color:#1a1200;font-weight:800;font-size:15px;letter-spacing:.3px;box-shadow:0 10px 30px rgba(242,189,44,.28),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.sm{width:auto;padding:11px 16px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.lfoot{text-align:center;color:var(--dim);font-size:12px;margin-top:18px}
.login-status{min-height:20px;margin-top:10px;text-align:center;color:var(--muted);font-size:13px}
.login-status.error{color:#ff9a9a}
.login .btn[disabled]{opacity:.65;cursor:wait}

/* HEADER */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(7,7,10,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .lg{width:42px;height:42px;border-radius:50%;overflow:hidden;display:grid;place-items:center;border:1px solid var(--gline);background:#000;flex:none}
.top .lg img{width:100%;height:100%;object-fit:cover}
.top .lg .wm{font-size:8px}
.top .t1{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:19px;text-transform:uppercase;line-height:1}
.top .t2{font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:700;text-transform:uppercase}
.top .av{margin-left:auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1a1200;font-weight:800}
main{padding:20px 18px calc(150px + var(--safe-b))}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-h h2{font-size:22px}
.sec-h span{color:var(--muted);font-size:12px}

.hello h1{font-size:34px;line-height:1}
.hello p{color:var(--muted);font-size:14px;margin-top:6px}

/* HERO */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;background:linear-gradient(145deg,#1b1810,#101013 60%);border:1px solid var(--gline);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(242,189,44,.28),transparent 65%)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--g1);background:rgba(242,189,44,.12);border:1px solid var(--gline);padding:5px 10px;border-radius:99px}
.hero h3{font-size:27px;line-height:1.02;margin:14px 0 4px;position:relative;z-index:1}
.hero .hmod{color:var(--muted);font-size:13px;position:relative;z-index:1}
.bar{height:7px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;margin:16px 0 8px;position:relative;z-index:1}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .5s}
.hero .meta{font-size:12px;color:var(--muted);margin-bottom:16px;position:relative;z-index:1}
.hero .btn{position:relative;z-index:1}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px}
.stat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(242,189,44,.1);color:var(--g2);font-size:20px}
.stat b{font-size:20px;display:block;line-height:1;font-family:'Barlow Condensed';font-style:italic;font-weight:800}
.stat small{color:var(--muted);font-size:11px}

/* carousel */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.mcard{flex:0 0 66%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;position:relative;overflow:hidden;transition:.2s}
.mcard:active{transform:scale(.98)}
.mcard .n{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:64px;line-height:.8;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.95}
.mcard h4{font-size:15px;font-weight:700;margin:12px 0 4px;line-height:1.2}
.mcard small{color:var(--muted);font-size:12px}
.mcard .bar{margin:12px 0 0;height:5px}

/* bonus / generic list cards */
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;transition:.2s}
.row:active{transform:scale(.985)}
.row .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(242,189,44,.1);color:var(--g2);flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;line-height:1.25}
.row .tx small{color:var(--muted);font-size:12px}
.row .go{color:var(--dim);font-size:18px}
.row.gold-b{border-color:var(--gline);background:linear-gradient(135deg,#1a170e,#121216)}
.pill{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--muted)}
.pill.ok{background:rgba(61,220,151,.12);color:var(--ok)}
.pill.g{background:rgba(242,189,44,.14);color:var(--g1)}

/* modules accordion */
.pagehead h1{font-size:32px;line-height:1}
.pagehead p{color:var(--muted);font-size:14px;margin:6px 0 0}
.mod{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-top:12px;overflow:hidden}
.mod.open{border-color:var(--gline)}
.mod-h{width:100%;display:flex;align-items:center;gap:14px;padding:16px;text-align:left}
.mod-h .num{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--gold);color:#1a1200;font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:24px;flex:none}
.mod-h .num.b{font-size:11px;letter-spacing:.5px}
.mod-h .tx{flex:1;min-width:0}
.mod-h .tx b{display:block;font-size:15px;line-height:1.2}
.mod-h .tx small{color:var(--muted);font-size:12px}
.mod-h .chev{transition:.25s;color:var(--muted)}
.mod.open .chev{transform:rotate(90deg);color:var(--g2)}
.lessons{display:none;border-top:1px solid var(--line)}
.mod.open .lessons{display:block}
.les{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}
.les:last-child{border-bottom:0}
.les .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.15);font-size:14px;flex:none;color:transparent}
.les.done .st{background:var(--ok);border-color:var(--ok);color:#04150d}
.les .lt{flex:1;font-size:14px;font-weight:600;line-height:1.25}
.les small{color:var(--dim);font-size:11px}
.les .pl{color:var(--g2);font-size:18px}

/* materials */
.mat-hero{display:flex;gap:16px;align-items:center;border-radius:22px;padding:18px;background:linear-gradient(145deg,#1b1810,#111114);border:1px solid var(--gline);width:100%;text-align:left}
.cover{width:84px;aspect-ratio:3/4;border-radius:10px;background:linear-gradient(160deg,#2a2210,#0b0b0e);border:1px solid var(--gline);display:grid;place-items:center;flex:none;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.cover::before{content:"";position:absolute;inset:6px;border:1px solid rgba(242,189,44,.3);border-radius:6px}
.cover span{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:34px;line-height:.85;text-align:center}
.cover span small{display:block;font-size:9px;letter-spacing:1px;color:var(--muted);font-style:normal;font-weight:700;-webkit-text-fill-color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px}
.mini .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:rgba(242,189,44,.1);color:var(--g2)}
.mini b{font-size:14px;line-height:1.2}
.mini small{color:var(--muted);font-size:11.5px}

/* profile */
.pcard{text-align:center;background:linear-gradient(160deg,#1b1810,#111114);border:1px solid var(--gline);border-radius:24px;padding:26px 18px}
.pcard .big{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1a1200;font-size:36px;font-weight:800;font-family:'Barlow Condensed';font-style:italic;box-shadow:0 0 40px rgba(242,189,44,.3)}
.pcard h2{font-size:28px}
.pcard p{color:var(--muted);font-size:13px;margin:2px 0 12px}
.guar{display:flex;gap:12px;align-items:center;background:rgba(61,220,151,.07);border:1px solid rgba(61,220,151,.22);border-radius:18px;padding:14px;margin-top:12px;font-size:13px;color:#cfeedd}
.guar .ic{font-size:26px;color:var(--ok)}
.danger b{color:#ff8a8a}

/* BOTTOM NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + var(--safe-b));background:rgba(10,10,13,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:10px;font-weight:600;border-radius:12px;transition:.2s}
.nav button svg{font-size:20px}
.nav button.on{color:var(--g1)}
.nav button.on svg{filter:drop-shadow(0 0 8px rgba(242,189,44,.6))}

.fab{position:fixed;z-index:31;bottom:calc(84px + var(--safe-b));right:max(16px,calc(50% - 224px));display:flex;align-items:center;gap:8px;padding:13px 18px;border-radius:99px;background:linear-gradient(135deg,#1f1b10,#0e0e11);border:1px solid var(--gline);font-weight:700;font-size:14px;color:var(--g1);box-shadow:0 12px 30px rgba(0,0,0,.6),0 0 24px rgba(242,189,44,.15)}
.fab svg{font-size:18px}

/* LESSON */
.lp{padding-bottom:calc(60px + var(--safe-b))}
.lp-top{display:flex;align-items:center;gap:12px;padding:14px 18px;position:sticky;top:0;z-index:20;background:rgba(7,7,10,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.lp-top button.bk{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:18px}
.lp-top .t{min-width:0}
.lp-top small{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--g2);font-weight:800}
.lp-top b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none}
.stage.pfs{position:fixed;inset:0;z-index:100;aspect-ratio:auto;height:100dvh}
.stage:fullscreen{aspect-ratio:auto}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;pointer-events:none}
/* ---- shield topo (marca) ---- */
.shield-top{position:absolute;top:0;left:0;right:0;height:48px;z-index:5;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.0));pointer-events:none;display:flex;align-items:center;padding:0 14px;user-select:none;-webkit-user-select:none;transition:opacity .3s}
.shield-top .st-brand{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;font-size:14px;text-transform:uppercase;color:var(--g1);letter-spacing:1px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.shield-top .st-brand small{font-style:normal;font-weight:600;font-size:10px;color:rgba(255,255,255,.55);letter-spacing:0}

/* ---- overlay central (clique p/ play/pause) ---- */
.vid-overlay{position:absolute;top:0;bottom:0;left:0;right:0;z-index:4;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vov-playbtn{width:60px;height:60px;border-radius:50%;background:rgba(242,189,44,.9);color:#1a1200;display:grid;place-items:center;font-size:26px;opacity:0;transition:opacity .2s,transform .15s;transform:scale(.85);box-shadow:0 0 0 12px rgba(242,189,44,.18),0 10px 30px rgba(0,0,0,.5)}
.stage.paused .vov-playbtn{opacity:1;transform:scale(1)}

/* ---- barra de controles customizada ---- */
.custom-ctrl{position:absolute;bottom:0;left:0;right:0;z-index:5;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,0));transition:opacity .3s}
.stage.hide .shield-top,.stage.hide .custom-ctrl{opacity:0;pointer-events:none}
.cc-play{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1a1200;font-size:15px;transition:.15s;border:0}
.cc-play:active{transform:scale(.9)}
.cc-progress{flex:1;position:relative;height:36px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.cc-bg,.cc-watched,.cc-played{position:absolute;left:0;height:4px;border-radius:2px;pointer-events:none;transition:height .15s}
.cc-bg{width:100%;background:rgba(255,255,255,.18)}
.cc-watched{background:rgba(242,189,44,.35);max-width:100%}
.cc-played{background:var(--g1);max-width:100%}
.cc-thumb{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;transform:translateX(-50%);top:50%;margin-top:-6.5px;pointer-events:none;box-shadow:0 0 0 2px rgba(242,189,44,.5),0 2px 6px rgba(0,0,0,.6);opacity:0;transition:opacity .15s}
.cc-progress:hover .cc-bg,.cc-progress:hover .cc-watched,.cc-progress:hover .cc-played{height:6px}
.cc-progress:hover .cc-thumb,.cc-progress.dragging .cc-thumb{opacity:1}
.cc-time{flex:none;font-size:11px;font-weight:700;color:rgba(255,255,255,.7);white-space:nowrap;letter-spacing:.4px;min-width:72px;text-align:right}
.cc-lock{flex:none;font-size:14px;color:rgba(242,189,44,.6)}

/* ---- auto-hide fade ---- */
.stage .shield-top,.stage .custom-ctrl,.stage .vid-overlay{opacity:1}
.stage.started.hide .shield-top,.stage.started.hide .custom-ctrl{opacity:0;pointer-events:none}

@media(max-width:480px){
  .custom-ctrl{height:46px;padding:0 8px;gap:7px}
  .cc-play{width:32px;height:32px;font-size:13px}
  .cc-time{font-size:10px;min-width:60px}
  .shield-top{height:42px;padding:0 10px}
  .shield-top .st-brand small{display:none}
}
.poster{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:
  radial-gradient(circle at 50% 40%,rgba(242,189,44,.22),transparent 55%),linear-gradient(160deg,#1a160b,#050507);text-align:center;padding:16px}
.poster .pb{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1a1200;font-size:30px;box-shadow:0 0 0 10px rgba(242,189,44,.14),0 14px 40px rgba(242,189,44,.35);margin:0 auto 14px;transition:.2s}
.poster .pb:active{transform:scale(.94)}
.poster b{font-family:'Barlow Condensed';font-style:italic;text-transform:uppercase;font-weight:800;font-size:19px;display:block;line-height:1.05;padding:0 10px}
.poster small{color:var(--muted);font-size:12px}
.endcard{position:absolute;inset:0;z-index:7;display:none;place-items:center;text-align:center;background:rgba(5,5,7,.96);padding:16px}
.endcard.show{display:grid}
.endcard .ck{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#04150d;display:grid;place-items:center;margin:0 auto 10px;font-size:28px}
.endcard b{display:block;font-family:'Barlow Condensed';font-style:italic;text-transform:uppercase;font-size:22px;font-weight:800;margin-bottom:12px}
.ctrl{display:none!important}
.centerplay{display:none!important}
/* Oculta botão de tela cheia customizado */
[data-act="fs"]{display:none!important}
/* Garante que o stage nunca expanda para fullscreen nativo */
.stage:fullscreen,.stage:-webkit-full-screen{width:100%!important;height:auto!important;aspect-ratio:16/9!important;position:static!important}

.lbody{padding:18px}
.lbody h1{font-size:28px;line-height:1.02}
.lbody .ml{color:var(--muted);font-size:13px;margin:6px 0 16px}
.acts{display:grid;grid-template-columns:1fr;gap:10px}
.navp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.notes{margin-top:22px}
.notes textarea{width:100%;min-height:110px;resize:vertical;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:14px;outline:none}
.notes textarea:focus{border-color:var(--g2)}

/* MODAL */
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{width:100%;max-width:480px;max-height:92dvh;overflow:auto;background:linear-gradient(180deg,#17151a,#0d0d10);border:1px solid var(--gline);border-bottom:0;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + var(--safe-b));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font-size:26px;margin-bottom:4px}
.sheet .x{float:right;width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:16px}
.sheet p.s{color:var(--muted);font-size:13px;margin-bottom:16px}
.pdfbox{position:fixed;inset:0;z-index:210;background:#000;display:flex;flex-direction:column}
.pdfbox header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#0b0b0e;border-bottom:1px solid var(--line)}
.pdfbox header b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdfbox iframe{flex:1;border:0;background:#fff}
.download-intro{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--gline);border-radius:18px;background:linear-gradient(145deg,#1b1810,#111114);margin-top:18px}
.download-intro .ic{font-size:24px;color:var(--g2);flex:none}
.download-intro b{display:block;font-size:14px;margin-bottom:4px}
.download-intro p{font-size:12px;color:var(--muted);line-height:1.5}
.pdf-download{display:inline-flex;align-items:center;justify-content:center;gap:7px;margin-top:9px;padding:9px 12px;border:1px solid var(--gline);border-radius:11px;color:var(--g1);font-size:12px;font-weight:800;text-decoration:none;background:rgba(242,189,44,.08)}
.pdf-download.locked{opacity:.45;pointer-events:none;color:var(--muted);border-color:var(--line);background:rgba(255,255,255,.03)}
.download-guide{padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin:12px 0}
.download-guide b{display:block;font-size:14px;margin-bottom:4px}
.download-guide p{font-size:12px;color:var(--muted);line-height:1.5}
.download-link{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:12px 15px;border-radius:12px;background:var(--gold);color:#1a1200;font-weight:800;font-size:13px;text-decoration:none}
.rdpdf{width:100%;height:calc(100dvh - 150px);min-height:420px;border:0;background:#282828}
.rdbody:has(.rdpdf){display:block;padding:12px;background:#08080a}
.step{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.step span{font-size:13px;color:var(--muted)}
.step .ctl{display:flex;align-items:center;gap:12px}
.step .ctl button{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.07);font-size:18px;font-weight:700}
.step .ctl b{min-width:34px;text-align:center;font-size:18px}
.step input{width:90px;text-align:right;background:#0a0a0d;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px;outline:none}
.result{text-align:center;border-radius:20px;padding:20px;margin:16px 0;background:linear-gradient(145deg,#1b1810,#111114);border:1px solid var(--gline)}
.result small{color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.result .v{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:52px;line-height:1;margin:6px 0}
.tip{font-size:13px;color:var(--muted);text-align:center}
.tip b{color:var(--g1)}

/* AVISO DE VÍDEOS E ATUALIZAÇÕES */
.video-notice-box{background:linear-gradient(160deg,rgba(242,189,44,.12),rgba(17,17,20,.96));border:1.5px solid var(--gline);border-radius:20px;padding:22px;margin:18px 0 20px;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:left}
.video-notice-box.sm{padding:16px;background:rgba(242,189,44,.07);margin-bottom:16px}
.vnb-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.vnb-tag{background:var(--gold);color:#1a1200;font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:8px}
.video-notice-box h3{font-size:22px;color:var(--text);margin:0;font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;letter-spacing:.5px;line-height:1.2}
.vnb-p{font-size:13.5px;color:rgba(255,255,255,.88);line-height:1.55;margin:8px 0 16px}
.vnb-action{background:rgba(0,0,0,.5);border:1px solid rgba(242,189,44,.3);border-radius:16px;padding:18px 16px;text-align:left}
.vnb-action h4{font-size:15px;color:var(--g1);margin-bottom:8px;font-weight:800;line-height:1.3}
.vnb-action p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.vnb-cta-lead{color:var(--text)!important;margin:12px 0 14px!important}
.vnb-action .btn{width:100%;font-size:14px;padding:14px}

/* ÁREA VIP */
.vip-grid{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.vip-card{background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(17,17,20,.95));border:1.5px solid var(--line);border-radius:22px;padding:22px 20px;transition:.25s;position:relative;overflow:hidden;text-align:left}
.vip-card.unlocked{border-color:var(--gline);background:linear-gradient(160deg,rgba(242,189,44,.1),rgba(17,17,20,.95));box-shadow:0 12px 34px rgba(242,189,44,.1)}
.vip-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.vip-badge{font-size:11px;font-weight:800;letter-spacing:.5px;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.08);color:var(--muted)}
.vip-card.unlocked .vip-badge{background:rgba(242,189,44,.2);color:var(--g1)}
.vip-card h3{font-size:22px;margin-bottom:8px;font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800}
.vip-card p{font-size:13.5px;color:var(--muted);line-height:1.5}
.vip-body{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.vip-unlocked-box{display:flex;flex-direction:column;gap:10px;background:rgba(61,220,151,.08);border:1px solid rgba(61,220,151,.25);border-radius:14px;padding:14px 16px;font-size:13px;color:#cfeedd}
.vip-locked-box{display:flex;flex-direction:column;gap:12px;background:rgba(0,0,0,.35);border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center}
.vip-locked-box p{color:var(--text);font-size:13px;margin:0}


/* CHAT */
.chat{display:flex;flex-direction:column;gap:10px;max-height:34dvh;overflow:auto;padding:4px 2px 8px;scroll-behavior:smooth}
.bub{max-width:86%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.4;animation:fd .25s}
.bub.bot{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--gold);color:#1a1200;font-weight:600;border-bottom-right-radius:5px}
.bub.typ{color:var(--muted);letter-spacing:3px}
.bub a.btn{margin-top:10px}
.chips{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:24dvh;overflow:auto}
.chip{text-align:left;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(242,189,44,.08);border:1px solid var(--gline);color:var(--g1)}
.chip:active{transform:scale(.985)}
.cin{display:flex;gap:8px;align-items:center}
.cin .inp{padding:13px 14px;font-size:15px}
.cin .btn{width:50px;height:48px;padding:0;flex:none}

.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);z-index:300;background:#1d1b14;border:1px solid var(--gline);color:var(--text);padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:up .25s;max-width:90%;text-align:center}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.toast{animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.view{animation:fd .3s}

/* TRILHA */
.num2{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--gold);color:#1a1200;font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:24px;flex:none}
.row.lk{opacity:.55}
.row.lk .num2{background:rgba(255,255,255,.08);color:var(--muted)}
.row.dn .num2{background:var(--ok);color:#04150d}
.row .tx small{display:block;margin-top:2px;line-height:1.35}
.lockp{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:rgba(242,189,44,.07);border:1px solid var(--gline);margin:16px 0 12px;font-size:14px}
.rd{height:100dvh;display:flex;flex-direction:column}
.rdbody{flex:1;min-height:0;background:#0b0b0e}
.rdbody iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.nopdf{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.rdbar{display:flex;gap:12px;align-items:center;padding:12px 16px calc(12px + var(--safe-b));background:rgba(10,10,13,.97);border-top:1px solid var(--line)}
.rdinfo{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.rdinfo .bar{margin:6px 0 0;height:5px}

/* ===== RESPONSIVO ===== */
.lcard{width:100%;max-width:440px;margin-left:auto;margin-right:auto}
.brand{display:none}
.pf{max-width:640px;margin-left:auto;margin-right:auto}

/* tablet */
@media(min-width:600px){
  #app{max-width:640px}
  .nav{max-width:640px}
  .fab{right:max(16px,calc(50% - 304px))}
}

/* computador */
@media(min-width:900px){
  body{font-size:16px}
  #app{max-width:1180px;border:0!important;box-shadow:none!important;background:none}
  body.shell #app{max-width:none;margin:0 0 0 248px}

  /* menu lateral */
  .nav{top:0;bottom:0;left:0;transform:none;width:248px;max-width:248px;display:flex;flex-direction:column;gap:6px;padding:26px 16px;border-top:0;border-right:1px solid var(--line);background:rgba(10,10,13,.96)}
  .brand{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 26px;margin-bottom:14px;border-bottom:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:24px;line-height:.95;text-align:center}
  .brand img{width:132px;height:132px;border-radius:50%;object-fit:cover;box-shadow:0 0 40px rgba(242,189,44,.25)}
  .nav button{flex-direction:row;justify-content:flex-start;gap:14px;padding:15px 18px;font-size:15px;border-radius:14px}
  .nav button svg{font-size:22px}
  .nav button:hover{background:rgba(255,255,255,.04);color:var(--text)}
  .nav button.on{background:rgba(242,189,44,.1);color:var(--g1)}

  /* topo e conteúdo */
  .top{padding:18px max(40px,calc((100% - 1040px)/2))}
  .top .lg,.top .t1{display:none}
  .top .t2{font-size:12px;letter-spacing:2px;color:var(--g2)}
  main{max-width:none;padding:36px max(40px,calc((100% - 1040px)/2)) 90px}
  .fab{right:32px;bottom:32px}

  .hello h1{font-size:46px}
  .hello p{font-size:16px}
  .hero{padding:32px 36px}
  .hero h3{font-size:40px}
  .hero .hmod,.hero .meta{font-size:15px}
  .hero .btn{width:auto;display:inline-flex;padding:17px 38px}
  .stats{gap:16px}
  .stat{padding:20px}
  .stat b{font-size:26px}
  .sec-h h2{font-size:26px}
  .pagehead h1{font-size:42px}
  .pagehead p{font-size:16px}

  .trilha,.rgrid{display:grid;gap:14px}
  .trilha{grid-template-columns:repeat(3,1fr)}
  .rgrid{grid-template-columns:repeat(2,1fr)}
  .trilha .sec-h{grid-column:1/-1;margin-bottom:0}
  .trilha .row,.rgrid .row{margin:0;height:100%}
  .row{padding:18px;transition:.2s}
  .row:hover{border-color:var(--gline);transform:translateY(-2px)}
  .row.lk:hover{transform:none;border-color:var(--line)}
  .trilha .row .tx b{font-size:14.5px}
  .trilha .row .pill{font-size:9px;padding:4px 7px}

  /* aula em vídeo e leitor */
  .lp{max-width:1040px;margin:0 auto;padding-bottom:70px}
  .lp-top{padding:18px 0;background:transparent;backdrop-filter:none;border-bottom:0;position:static}
  .stage{border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid var(--gline)}
  .lbody{padding:26px 0}
  .lbody h1{font-size:40px}
  .acts{max-width:420px}
  .navp{max-width:420px}
  .rd{max-width:1180px;margin:0 auto}
  .rd .lp-top{padding:16px 28px;background:transparent}
  .rdbody{margin:0 28px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .rdbar{margin:0 28px;padding:16px 0 20px;background:none;border-top:0}

  /* login */
  .login{max-width:520px;margin:0 auto}
  .login .logo{width:210px;height:210px}

  /* janelas */
  .modal{align-items:center}
  .sheet{max-width:520px;border-radius:26px;border-bottom:1px solid var(--gline);animation:fd .25s}
  .chat{max-height:42dvh}
  .chips{max-height:30dvh}
  .toast{bottom:40px}
}

/* telas muito grandes */
@media(min-width:1500px){
  body.shell #app{margin-left:248px}
  main,.top{padding-left:max(40px,calc((100% - 1100px)/2));padding-right:max(40px,calc((100% - 1100px)/2))}
}

const normalizaProduto = value => String(value||"").trim().toLocaleLowerCase("pt-BR");
function produtoConfigurado(ref){
  const key=normalizaProduto(ref);
  return ACCESS_CONFIG.products.concat(ACCESS_CONFIG.offers||[]).find(p=>[p.name,p.id,...(p.aliases||[])].some(x=>normalizaProduto(x)===key))||null;
}
function temAcessoProduto(nomeProduto){
  if(isAdmin()) return true;
  if(!accessSession || !Array.isArray(accessSession.products)) return false;
  const produto=produtoConfigurado(nomeProduto);
  const aliases=produto?[produto.name,produto.id,...(produto.aliases||[])]:[nomeProduto];
  const allowed=new Set(aliases.map(normalizaProduto));
  return accessSession.products.some(item=>{
    const values=typeof item==="string"?[item]:item&&typeof item==="object"?[item.name,item.id,...(item.aliases||[])]:[];
    return values.some(value=>allowed.has(normalizaProduto(value)));
  });
}
function AcessoProdutoGuard(produtoRef,conteudo,ofertaBloqueada=""){
  if(temAcessoProduto(produtoRef)) return conteudo;
  const produto=produtoConfigurado(produtoRef), url=ofertaBloqueada||produto?.purchaseUrl||"";
  return `<section class="lcard access-offer"><h2 class="gold">Conteúdo bloqueado</h2><p class="sub">Este conteúdo requer acesso a ${esc(produto?.name||produtoRef)}.</p>${url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Conhecer a oferta ${ic("chev")}</a>`:""}</section>`;
}

async function consultarAcesso(email){
  const cleanEmail = String(email||"").trim().toLowerCase();
  if(isAdmin(cleanEmail)){
    const allProducts = ACCESS_CONFIG.products.concat(ACCESS_CONFIG.offers||[]).map(p=>p.id);
    return {autorizado:true, products:allProducts};
  }
  const url=ACCESS_CONFIG.endpoint+"?email="+encodeURIComponent(email);
  const response=await fetch(url,{method:"GET",headers:{Accept:"application/json"},cache:"no-store"});
  if(!response.ok) throw new Error("Não foi possível verificar o acesso agora.");
  const result=await response.json();
  return {autorizado:result?.autorizado===true,products:Array.isArray(result?.produtos)?result.produtos:[]};
}
function salvarSessao(email,products){
  accessSession={email,products,timestamp:Date.now()};
  state.email=email;
  store.set(ACCESS_CONFIG.sessionKey,accessSession);
}
function encerrarSessao(){
  store.remove(ACCESS_CONFIG.sessionKey); accessSession=null; state.email=null;
  state.aula=null; state.mod=null; state.view="home"; done={}; render();
}
function restaurarSessao(){
  if(!accessChecking){ render(); return; }
  render();
  const email=storedAccessSession.email.trim().toLowerCase();
  consultarAcesso(email).then(result=>{
    if(result.autorizado){
      accessSession={email,products:result.products,timestamp:Date.now()};
      if(temAcessoProduto(PRINCIPAL_PRODUCT.id)){ state.email=email; store.set(ACCESS_CONFIG.sessionKey,accessSession); loadUser(); }
      else { store.remove(ACCESS_CONFIG.sessionKey); accessSession=null; accessNotice="Este e-mail não tem acesso ativo ao produto principal. Entre com o e-mail usado na compra."; }
    } else { store.remove(ACCESS_CONFIG.sessionKey); accessSession=null; accessNotice="Este e-mail não tem acesso ativo ao produto principal. Entre com o e-mail usado na compra."; }
  }).catch(()=>{ accessSession=null; accessNotice="Não foi possível confirmar seu acesso agora. Confira sua conexão e tente entrar novamente."; })
    .finally(()=>{ accessChecking=false; render(); });
}

/* =====================================================================
   PLAYER (YouTube blindado: sem clicar no vídeo, sem canal, sem sair)
   ===================================================================== */
let yt=null, ytTimer=null, ytHide=null, curSpeed=1, ytQueue=[], maxWatched=0;
function loadYT(cb){
  if(window.YT && YT.Player){ cb(); return; }
  ytQueue.push(cb);
  if(document.getElementById("yt-api")) return;
  const s=document.createElement("script"); s.id="yt-api"; s.src="https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
  window.onYouTubeIframeAPIReady=()=>{ const q=ytQueue.slice(); ytQueue=[]; q.forEach(f=>f()); };
}
function killPlayer(){
  stopReader();
  clearInterval(ytTimer); clearTimeout(ytHide);
  try{ yt && yt.destroy(); }catch(e){}
  yt=null; maxWatched=0;
  if(document.fullscreenElement) try{document.exitFullscreen()}catch(e){}
}
const fmt = s => { s=Math.max(0,Math.floor(s||0)); const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); };

function startVideo(a){
  const id = ytId(a.video);
  if(!id){ toast("O vídeo desta aula será liberado em breve."); return; }
  const stage=$("#stage"), mount=$("#mount");
  $("#poster").style.display="none";
  stage.classList.add("started");
  maxWatched = (done[a.id] || isAdmin()) ? 999999 : Number(store.get("u:"+state.email+":max:"+a.id, 0));
  const rawStartAt = Math.floor(store.get("u:"+state.email+":pos:"+a.id,0));
  const startAt = (done[a.id] || isAdmin()) ? rawStartAt : Math.min(rawStartAt, Math.floor(maxWatched));
  const q = new URLSearchParams({
    enablejsapi:"1", controls:"0", rel:"0", modestbranding:"1", iv_load_policy:"3",
    playsinline:"1", fs:"0", autoplay:"1", hl:"pt-BR", cc_lang_pref:"pt", cc_load_policy:"1"
  });
  if(startAt>5) q.set("start",startAt);
  if(location.protocol.startsWith("http")) q.set("origin",location.origin);
  const f=document.createElement("iframe");
  f.src="https://www.youtube.com/embed/"+id+"?"+q.toString();
  f.allow="autoplay; encrypted-media; picture-in-picture";
  f.tabIndex = -1;
  f.setAttribute("tabindex","-1");
  f.setAttribute("sandbox","allow-scripts allow-same-origin allow-presentation"); /* bloqueia popups/links para fora */
  f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
  f.title=a.titulo;
  mount.appendChild(f);
  loadYT(()=>{
    yt = new YT.Player(f,{ events:{
      onReady:e=>{
        try{
          e.target.setPlaybackRate(curSpeed);
          if(e.target.loadModule) e.target.loadModule("captions");
          if(e.target.setOption) e.target.setOption("captions", "track", {languageCode:"pt"});
          e.target.playVideo();
        }catch(_){}
      },
      onStateChange:e=>{
        const S=e.data;
        stage.classList.toggle("paused", S!==1 && S!==3);
        $("#bplay").innerHTML = ic(S===1?"pause":"play");
        if(S===1){
          try{
            if(e.target.loadModule) e.target.loadModule("captions");
            if(e.target.setOption) e.target.setOption("captions", "track", {languageCode:"pt"});
          }catch(_){}
          kick();
        }
        if(S===0){
          done[a.id]=true;
          saveDone();
          maxWatched=999999;
          store.set("u:"+state.email+":pos:"+a.id,0);
          store.set("u:"+state.email+":max:"+a.id,999999);
          $("#endcard").classList.add("show");
          refreshDoneBtn(a);
          stage.classList.remove("hide");
        }
      }}});
    ytTimer=setInterval(()=>tick(a),500);
  });
}
let lastSave=0;
function tick(a){
  if(!yt||!yt.getCurrentTime) return;
  try{
    const t=yt.getCurrentTime(), d=yt.getDuration()||0;
    const pct = d>0 ? Math.min(100, 100*t/d) : 0;
    const wpct = d>0 ? Math.min(100, 100*maxWatched/d) : 0;
    const tm=$("#tm"); if(tm) tm.textContent=fmt(t)+" / "+fmt(d);
    const pp=$("#cc-played"), pw=$("#cc-watched"), pt=$("#cc-thumb");
    if(pp) pp.style.width=pct+"%";
    if(pw) pw.style.width=wpct+"%";
    if(pt) pt.style.left=pct+"%";

    // Regra anti-avanço: o aluno pode voltar, mas não pode pular para frente do que já assistiu
    if(!isAdmin() && !done[a.id]){
      if(t > maxWatched + 2.5){
        try{ yt.seekTo(maxWatched, true); }catch(_){}
        toast("Você pode voltar o vídeo, mas não pode avançar além do que já assistiu.");
        return;
      } else if(t > maxWatched){
        maxWatched = t;
        store.set("u:"+state.email+":max:"+a.id, maxWatched);
      }
      // Conclusão automática ao atingir o final da aula
      if(d > 0 && (t >= d - 2 || (t/d) >= 0.98)){
        done[a.id] = true;
        saveDone();
        maxWatched = d;
        store.set("u:"+state.email+":max:"+a.id, d);
        refreshDoneBtn(a);
      }
    }

    if(Date.now()-lastSave>4000 && yt.getPlayerState()===1){
      lastSave=Date.now();
      store.set("u:"+state.email+":pos:"+a.id,t);
    }
  }catch(e){}
}
function kick(){ const s=$("#stage"); if(!s) return; s.classList.remove("hide"); clearTimeout(ytHide); ytHide=setTimeout(()=>{ if(yt&&yt.getPlayerState&&yt.getPlayerState()===1) s.classList.add("hide"); },2800); }
function togglePlay(){
  if(!yt) return;
  try{ const S=yt.getPlayerState(); if(S===1) yt.pauseVideo(); else { $("#endcard").classList.remove("show"); yt.playVideo(); } }catch(e){}
}
function refreshDoneBtn(a){
  const b=$("#bdone"); if(!b) return;
  const isDone = !!done[a.id];
  b.className="btn "+(isDone?"ghost":"");
  if(isAdmin()){
    b.disabled = false;
    b.innerHTML = isDone ? ic("check")+" Vídeo concluído (desmarcar)" : ic("check")+" Marcar como concluído";
  } else {
    b.disabled = !isDone;
    b.innerHTML = isDone ? ic("check")+" Vídeo concluído ✓" : ic("lock")+" Libera ao assistir até o final";
  }
}

function bindLesson(a){
  const stage=$("#stage"), nt=$("#nt");

  /* overlay central — clique pausa/retoma */
  $("#vid-overlay")?.addEventListener("click",()=>{
    if(!stage.classList.contains("started")) return;
    togglePlay(); kick();
  });

  /* toque/mouse na barra de progresso customizada */
  const track=$("#cc-track");
  if(track){
    let dragging=false;
    function seekPct(e){
      const rect=track.getBoundingClientRect();
      const cx=e.touches?e.touches[0].clientX:(e.clientX??e.x);
      let pct=Math.max(0,Math.min(1,(cx-rect.left)/rect.width));
      if(!yt) return;
      const d=yt.getDuration()||0; if(!d) return;
      let target=pct*d;
      if(!isAdmin()&&!done[a.id]&&target>maxWatched+1){
        target=maxWatched;
        toast("Você pode voltar o vídeo, mas não pode avançar além do que já assistiu.");
      }
      try{ yt.seekTo(target,true); }catch(e){}
      kick();
    }
    track.addEventListener("pointerdown",e=>{
      if(!stage.classList.contains("started")) return;
      dragging=true; track.classList.add("dragging");
      track.setPointerCapture(e.pointerId);
      seekPct(e);
    });
    track.addEventListener("pointermove",e=>{ if(dragging) seekPct(e); });
    track.addEventListener("pointerup",e=>{
      if(!dragging) return;
      dragging=false; track.classList.remove("dragging");
      seekPct(e);
    });
    track.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
  }

  /* botão play/pause */
  $("#bplay")?.addEventListener("click",()=>{ togglePlay(); kick(); });

  stage?.addEventListener("mousemove",kick);
  nt?.addEventListener("input",e=>store.set("u:"+state.email+":note:"+a.id,e.target.value));
  stage?.addEventListener("contextmenu",e=>e.preventDefault());
}

/* ---------- Chat de dúvidas ---------- */
const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ");
function chatScroll(){ const c=$("#cmsg"); if(c) c.scrollTop=c.scrollHeight; }
function bubble(txt,who){ const c=$("#cmsg"); if(!c) return null; const b=document.createElement("div"); b.className="bub "+who; b.textContent=txt; c.appendChild(b); chatScroll(); return b; }
function botSay(txt,wa){
  const t=bubble("•••","bot typ"); if(!t) return;
  setTimeout(()=>{
    t.className="bub bot"; t.textContent=txt;
    if(wa){ const l=waLink("Olá! Tenho uma dúvida sobre o Martelinho Money. E-mail da compra: "+state.email);
      if(l){ const a=document.createElement("a"); a.className="btn sm"; a.href=l; a.target="_blank"; a.rel="noopener"; a.style.textDecoration="none"; a.innerHTML=ic("chat")+" Chamar no WhatsApp"; t.appendChild(a); } }
    chatScroll();
  },550);
}
function answer(text,idx){
  bubble(text,"me");
  let item = idx!=null ? CONFIG.faq[idx] : null;
  if(!item){
    const toks = norm(text).split(/\s+/).filter(w=>w.length>2);
    let best=0;
    CONFIG.faq.forEach(f=>{
      const hay=" "+norm(f.q+" "+(f.k||""))+" ";
      const sc=toks.reduce((n,w)=>n+(hay.includes(w)?1:0),0);
      if(sc>best){ best=sc; item=f; }
    });
    if(best<1) item=null;
  }
  if(item) botSay(item.a);
  else botSay("Não encontrei essa resposta por aqui. Escolha uma das perguntas abaixo ou fale direto com o suporte.",true);
}
function chatModal(){
  openModal(`<button class="x" data-act="closem">${ic("x")}</button>
    <h3 class="gold">Dúvidas?</h3><p class="s">Toque numa pergunta ou escreva a sua.</p>
    <div class="chat" id="cmsg"></div>
    <div class="chips">${CONFIG.faq.map((f,i)=>`<button class="chip" data-act="faq" data-i="${i}">${esc(f.q)}</button>`).join("")}</div>
    <div class="cin"><input id="cin" class="inp" type="text" placeholder="Escreva sua dúvida..." autocomplete="off"><button class="btn" data-act="csend" aria-label="Enviar">${ic("chev")}</button></div>`);
  bubble("Fala, "+nome()+"! Sou o assistente do Martelinho Money. Como posso ajudar?","bot");
  $("#cin").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); sendChat(); } });
}
function sendChat(){ const i=$("#cin"); const v=(i.value||"").trim(); if(!v) return; i.value=""; answer(v,null); }

/* =====================================================================
   RENDER + EVENTOS
   ===================================================================== */
function render(){
  killPlayer();
  document.body.classList.remove("shell");
  const root=$("#root");
  if(accessChecking){ root.innerHTML=accessLoadingHTML(); return; }
  if(!state.email || !temAcessoProduto(PRINCIPAL_PRODUCT.id)){ root.innerHTML=loginHTML(); bindLogin(); return; }
  if(state.mod){
    const m=MODULOS.find(x=>x.id===state.mod);
    root.innerHTML=AcessoProdutoGuard(PRINCIPAL_PRODUCT.id,readerHTML(m)); startReader(m); try{window.scrollTo(0,0)}catch(e){} return;
  }
  if(state.aula){
    const a=findAula(state.aula);
    root.innerHTML=AcessoProdutoGuard(PRINCIPAL_PRODUCT.id,lessonHTML(a)); bindLesson(a); try{window.scrollTo(0,0)}catch(e){} return;
  }
  document.body.classList.add("shell");
  root.innerHTML=AcessoProdutoGuard(PRINCIPAL_PRODUCT.id,appHTML());
  try{window.scrollTo(0,0)}catch(e){}
}
async function doLogin(){
  const input=$("#em"), status=$("#er"), button=$("#loginBtn");
  const email=(input?.value||"").trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ status.textContent="Digite um e-mail válido."; status.classList.add("error"); return; }
  if(button.disabled) return;
  button.disabled=true; input.disabled=true; status.classList.remove("error"); status.textContent="Verificando acesso...";
  try{
    const result=await consultarAcesso(email);
    accessSession={email,products:result.products,timestamp:Date.now()};
    if(!result.autorizado || !temAcessoProduto(PRINCIPAL_PRODUCT.id)){
      accessSession=null; status.textContent="Não encontramos uma compra ativa do Martelinho Money para este e-mail. Confira o e-mail usado na compra."; status.classList.add("error");
      button.disabled=false; input.disabled=false; return;
    }
    salvarSessao(email,result.products); loadUser(); state.view="home"; render();
  }catch(error){
    accessSession=null; status.textContent="Não foi possível verificar seu acesso agora. Confira sua conexão e tente novamente."; status.classList.add("error");
    button.disabled=false; input.disabled=false;
  }
}
function bindLogin(){
  $("#em").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); doLogin(); } });
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case "login": doLogin(); break;
    case "go": state.view=el.dataset.v; state.aula=null; state.mod=null; closeModal(); render(); break;
    case "open": { const a=findAula(id); if(!a) break;
      if(!estudoOk()){ toast("Conclua os módulos de estudo para liberar os vídeos."); break; }
      const i=VIDEOS.findIndex(v=>v.id===id);
      if(!vidLiberado(i)){ toast("Conclua o vídeo anterior para liberar este."); break; }
      state.aula=id; state.mod=null; closeModal(); render(); break; }
    case "openmod": { const i=MODULOS.findIndex(m=>m.id===id); if(i<0) break;
      if(!modLiberado(i)){ toast("Conclua o módulo anterior para liberar este."); break; }
      state.mod=id; state.aula=null; closeModal(); render(); break; }
    case "back": state.aula=null; state.mod=null; render(); break;
    case "rdone": { const m=MODULOS.find(x=>x.id===state.mod); if(!m||done[m.id]) break;
      if(rdAcc<reqSeg(m)) break;
      done[m.id]=true; saveDone(); updReader(m); afterModule(m); break; }
    case "rnext": { const m=MODULOS.find(x=>x.id===state.mod); if(!m) break;
      const nx=MODULOS[MODULOS.indexOf(m)+1];
      if(nx){ state.mod=nx.id; } else { state.mod=null; state.view="videos"; }
      render(); break; }
    case "start": startVideo(findAula(state.aula)); break;
    case "tog": togglePlay(); kick(); break;
    case "speed": { const arr=[1,1.25,1.5,2]; curSpeed=arr[(arr.indexOf(curSpeed)+1)%arr.length]; $("#bspeed").textContent=curSpeed+"x"; try{yt&&yt.setPlaybackRate(curSpeed)}catch(_){} break; }
    case "fs": toggleFS(); break;
    case "done": { const a=findAula(state.aula); if(!a) break;
      if(!isAdmin() && !done[a.id]){ toast("Assista ao vídeo até o final para concluir."); break; }
      done[a.id]=!done[a.id]; saveDone(); refreshDoneBtn(a); toast(done[a.id]?"Vídeo marcado como concluído ✓":"Vídeo desmarcado"); break; }
    case "cert": certModal(); break;
    case "closem": closeModal(); break;
    case "suporte": chatModal(); break;
    case "faq": { const f=CONFIG.faq[+el.dataset.i]; if(f) answer(f.q,+el.dataset.i); break; }
    case "csend": sendChat(); break;
    case "logout": encerrarSessao(); break;
  }
});
document.addEventListener("fullscreenchange",()=>{
  /* Se alguém entrar em fullscreen (ex: F11), sai imediatamente */
  if(document.fullscreenElement){
    try{ document.exitFullscreen(); }catch(e){}
  }
  const s=$("#stage"); if(s) s.classList.remove("pfs");
});
document.addEventListener("webkitfullscreenchange",()=>{
  if(document.webkitFullscreenElement){
    try{ document.webkitExitFullscreen(); }catch(e){}
  }
});

/* Bloqueios simples contra cópia casual; não substituem controle de acesso real. */
const alvoEditavel = el => !!el?.closest?.('input,textarea,[contenteditable="true"]');
document.addEventListener("contextmenu",e=>{ if(!alvoEditavel(e.target)) e.preventDefault(); },true);
document.addEventListener("selectstart",e=>{ if(!alvoEditavel(e.target)) e.preventDefault(); },true);
document.addEventListener("dragstart",e=>{ if(!alvoEditavel(e.target)) e.preventDefault(); },true);
document.addEventListener("copy",e=>{ if(!alvoEditavel(e.target)) e.preventDefault(); },true);
document.addEventListener("cut",e=>{ if(!alvoEditavel(e.target)) e.preventDefault(); },true);
document.addEventListener("paste",e=>{ if(!alvoEditavel(e.target)) e.preventDefault(); },true);
document.addEventListener("keydown",e=>{
  const key=e.key.toLowerCase(), mod=e.ctrlKey||e.metaKey;
  const devtools=e.key==="F12"||(mod&&e.shiftKey&&["i","j","c"].includes(key))||(mod&&key==="u");
  const clipboard=mod&&["c","x","a"].includes(key)&&!alvoEditavel(e.target);
  const fullscreenKey=e.key==="F11"||(mod&&e.key==="F");
  if(devtools||clipboard||fullscreenKey){ e.preventDefault(); e.stopPropagation(); }
},true);

/* início */
restaurarSessao();
